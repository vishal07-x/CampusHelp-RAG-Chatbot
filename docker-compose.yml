version: '3.8'

services:
  # 1. PostgreSQL Relational Database
  postgres:
    image: postgres:16-alpine
    container_name: campushelp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: campushelp
      POSTGRES_USER: campus_user
      POSTGRES_PASSWORD: campus_secure_password_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campus_user -d campushelp"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:v1.12.1
    container_name: campushelp_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: campushelp_backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://campus_user:campus_secure_password_2026@postgres:5432/campushelp
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_COLLECTION=campus_documents
      - SECRET_KEY=campushelp_super_secure_jwt_secret_key_change_in_production_2026
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-openai}
      - EMBEDDING_MODEL=text-embedding-3-small
      - LLM_PROVIDER=openai
      - LLM_MODEL=gpt-4o-mini
      - LLM_TEMPERATURE=0.2
      - CHUNK_SIZE=500
      - CHUNK_OVERLAP=50
      - TOP_K_CANDIDATES=10
      - RERANK_TOP_K=4
    ports:
      - "8000:8000"
    volumes:
      - uploaded_docs:/app/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy

  # 4. React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: campushelp_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  qdrant_data:
  uploaded_docs:
